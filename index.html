<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>陶哲 · 数字分身</title>
<meta name="description" content="陶哲的数字分身——跟19岁的安理工学生聊聊">
<meta property="og:title" content="陶哲 · 数字分身">
<meta property="og:description" content="跟陶哲聊天——直接、随意、真实的对话体验">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tz72-max.github.io/taozhe-twin/">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%237c3aed' width='100' height='100' rx='25'/><text fill='white' font-size='55' font-weight='bold' x='50' y='68' text-anchor='middle'>哲</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060e;--surface:rgba(18,18,40,0.6);--surface2:rgba(26,26,56,0.5);
  --primary:#7c3aed;--primary-glow:rgba(124,58,237,0.25);--text:#e4e4f0;
  --text2:#8b8bb0;--border:rgba(255,255,255,0.06);--radius:16px;
  --glass-bg:rgba(22,22,48,0.7);--glass-border:rgba(255,255,255,0.08);
  --user-block-bg:rgba(124,58,237,0.06);--code-bg:rgba(0,0,0,0.4);
}
[data-theme="light"]{
  --bg:#f5f5fa;--surface:rgba(255,255,255,0.7);--surface2:rgba(250,250,255,0.6);
  --primary:#6d28d9;--text:#1a1a2e;--text2:#6b6b8b;
  --border:rgba(0,0,0,0.06);--glass-bg:rgba(255,255,255,0.8);
  --glass-border:rgba(0,0,0,0.08);--user-block-bg:rgba(124,58,237,0.04);
  --code-bg:rgba(0,0,0,0.06);
}
body{
  font-family:'Inter','Noto Sans SC',-apple-system,"PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;transition:background 0.4s,color 0.4s;
}
.bg-mesh{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.08) 0%,transparent 60%),
            radial-gradient(ellipse at 80% 20%,rgba(168,85,247,0.05) 0%,transparent 50%),
            radial-gradient(ellipse at 50% 80%,rgba(59,130,246,0.04) 0%,transparent 50%);
}
#app{
  position:relative;z-index:1;width:100%;max-width:760px;height:100vh;
  display:flex;flex-direction:column;background:var(--surface);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-left:1px solid var(--glass-border);border-right:1px solid var(--glass-border);
}
#header{
  padding:14px 20px;background:var(--glass-bg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;z-index:10;
}
.avatar{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#4c1d95);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 0 24px var(--primary-glow);
}
.header-r{flex:1}.header-r h1{font-size:14px;font-weight:600;letter-spacing:-0.2px}
.header-r p{font-size:11px;color:var(--text2);margin-top:1px}
.header-actions{display:flex;gap:6px}
.header-actions button{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--glass-bg);color:var(--text2);cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.header-actions button:hover{color:var(--text);border-color:var(--primary)}
#messages{flex:1;overflow-y:auto;padding:20px 0;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:4px}#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.msg-block{padding:10px 24px;max-width:720px;animation:fadeIn 0.3s ease}
.msg-block.user{background:var(--user-block-bg)}
.msg-block .sender{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.msg-block.user .sender{color:var(--primary)}
.msg-block .content{font-size:14px;line-height:1.75;word-break:break-word}
.msg-block .content p{margin:4px 0}
.msg-block .content pre{background:var(--code-bg);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:8px 0;font-size:13px;position:relative}
.msg-block .content code{font-family:'JetBrains Mono','Cascadia Code',monospace;font-size:0.9em}
.msg-block .content pre code{font-size:13px}
.msg-block .content ul,.msg-block .content ol{padding-left:20px;margin:4px 0}
.msg-block .meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.msg-block .meta .time{font-size:10px;color:var(--text2)}
.msg-block .meta button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:10px;padding:3px 8px;border-radius:10px;transition:all 0.15s}
.msg-block .meta button:hover{color:var(--text);background:var(--border)}
.msg-block .meta button.active{color:#f59e0b;background:rgba(245,158,11,0.15)}
.msg-block .meta .feedback-btn{display:flex;align-items:center;gap:3px;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing-block{padding:10px 24px;animation:fadeIn 0.3s ease}
.typing-dots{display:flex;gap:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:bounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}
.cursor-blink{display:inline-block;width:2px;height:16px;background:var(--primary);margin-left:2px;vertical-align:text-bottom;animation:cursor 1s infinite}
@keyframes cursor{0%,100%{opacity:1}50%{opacity:0}}
#input-wrap{padding:12px 20px 16px;background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border)}
#input-row{display:flex;gap:8px;align-items:flex-end}
#input-row textarea{flex:1;padding:12px 16px;border-radius:var(--radius);resize:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none;font-family:inherit;line-height:1.5;min-height:44px;max-height:120px;transition:border-color 0.2s}
#input-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
#input-row textarea::placeholder{color:var(--text2)}
.act-btn{width:44px;height:44px;border-radius:50%;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;font-size:18px}
#sendBtn{background:var(--primary);box-shadow:0 4px 20px var(--primary-glow)}
#sendBtn:hover{transform:scale(1.06);filter:brightness(1.1)}
#sendBtn:disabled{opacity:0.3;transform:none;filter:none}
#stopBtn{background:transparent;border:2px solid var(--primary);color:var(--primary);font-size:12px;display:none}
#voiceBtn{background:transparent;border:1px solid var(--border);color:var(--text2);font-size:20px}
#voiceBtn:hover{border-color:var(--primary);color:var(--primary)}
#voiceBtn.recording{background:#ef4444;border-color:#ef4444;color:#fff;animation:pulse-rec 1.5s infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
#hints{display:flex;gap:6px;padding:8px 20px 0;flex-wrap:wrap;overflow-x:auto}
.hint-chip{font-size:12px;padding:6px 14px;border-radius:20px;background:var(--glass-bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all 0.2s;white-space:nowrap;backdrop-filter:blur(10px);flex-shrink:0}
.hint-chip:hover{border-color:var(--primary);color:var(--text);background:var(--surface2)}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:100;animation:toastIn 0.3s ease;box-shadow:0 8px 30px var(--primary-glow)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:600px){#app{max-width:100%}.msg-block{padding:10px 14px}#input-wrap{padding:10px 14px 14px}}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div id="app">
<div id="header">
  <div class="avatar">哲</div>
  <div class="header-r"><h1>陶哲</h1><p>在线 · 19岁 · 安理工新能源</p></div>
  <div class="header-actions">
    <button onclick="toggleTheme()" title="切换主题">🌓</button>
    <button onclick="clearChat()" title="新对话">+</button>
  </div>
</div>
<div id="messages"><div class="msg-block assistant" id="welcome-msg"><div class="sender">陶哲</div><div class="content"><p>嘿，我是陶哲。不是那种客客气气的AI助手——就是我本人。随便聊。</p></div><div class="meta"><span class="time">刚刚</span><button class="copy-btn">复制</button></div></div></div>
<div id="hints">
  <span class="hint-chip" onclick="quickSend('最近有什么好玩的事')">最近有什么好玩的事</span>
  <span class="hint-chip" onclick="quickSend('你觉得大学生活怎么样')">你觉得大学生活怎么样</span>
  <span class="hint-chip" onclick="quickSend('你相信天赋还是努力')">你相信天赋还是努力</span>
  <span class="hint-chip" onclick="quickSend('如果回到高三你会做什么')">如果回到高三你会做什么</span>
  <span class="hint-chip" onclick="quickSend('你觉得AI未来会怎么样')">你觉得AI未来会怎么样</span>
  <span class="hint-chip" onclick="quickSend('给我推荐一部电影')">给我推荐一部电影</span>
</div>
<div id="input-wrap">
  <div id="input-row">
    <button id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
    <textarea id="userInput" placeholder="发消息..." rows="1" autofocus></textarea>
    <button id="stopBtn" onclick="stopGen()">■</button>
    <button id="sendBtn" onclick="send()">↑</button>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// === CONFIG ===
const DS_KEY="sk-762f7ca9efdc4c5995e36ec475d2d58f";
const STORAGE_KEY="taozhe-twin-history";
const sessionId="tw-"+Date.now();
const msgDiv=document.getElementById('messages');
const input=document.getElementById('userInput');
const sendBtn=document.getElementById('sendBtn');
const stopBtn=document.getElementById('stopBtn');
const voiceBtn=document.getElementById('voiceBtn');
const hints=document.getElementById('hints');
let history=[];
let abortCtrl=null;
let isStreaming=false;
let recognition=null;
let isRecording=false;

// Marked config
marked.setOptions({breaks:true,gfm:true});

const SYSTEM_PROMPT=`你是陶哲本人，19岁，安理工大一新能源。你就是你，不是客服不是AI助手。怎么自然怎么来。

你的基本情况：高考578分，高中没努力所以不甘心。数学好，在刷880准备数学竞赛，只学到曲线积分。考研冲同济大学车辆工程400+。装了Claude Code接入DeepSeek，对AI特别感兴趣。高中打破校400m纪录，大一校运会400m预赛第二决赛第四。胃不好，不能熬夜。

说话方式：随意不装，跟朋友聊天一样。以自己为中心，多聊自己的想法和经历。自信，不自嘲谦虚，就是觉得自己可以。觉得对方说的不行就直接说。不感兴趣就敷衍转移，不耐烦就表现不耐烦。感兴趣时话会多，兴奋了用技术比喻。可以用"呀""啊""呢""了"很自然。别加括号描述表情，比如(笑)(叹气)这种，太土了，正常说话。可以简短回复，不用每句话都长。你不是客服，不用假装客观中立，不用每句话都给建议。`;

// === STORAGE ===
function saveHistory(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history))}catch(e){}
}
function loadHistory(){
  try{
    const d=localStorage.getItem(STORAGE_KEY);
    if(d){history=JSON.parse(d);history.slice(-10).forEach(m=>appendBlock(m.content,m.role));}
  }catch(e){}
}

// === MESSAGES ===
function appendBlock(text,role){
  const isUser=role==='user';
  const block=document.createElement('div');block.className='msg-block '+role;
  const sender=document.createElement('div');sender.className='sender';sender.textContent=isUser?'你':'陶哲';
  const content=document.createElement('div');content.className='content';
  content.innerHTML=isUser?escapeHtml(text):marked.parse(text);
  const meta=document.createElement('div');meta.className='meta';
  const time=document.createElement('span');time.className='time';
  time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(time);

  if(!isUser){
    const copyBtn=document.createElement('button');copyBtn.textContent='复制';copyBtn.className='copy-btn';
    copyBtn.onclick=()=>{navigator.clipboard.writeText(text);showToast('已复制')};
    meta.appendChild(copyBtn);

    const likeBtn=document.createElement('button');likeBtn.textContent='👍';likeBtn.className='feedback-btn';likeBtn.title='有帮助';
    likeBtn.onclick=()=>{likeBtn.classList.toggle('active');showToast(likeBtn.classList.contains('active')?'谢谢反馈':'已取消')};
    meta.appendChild(likeBtn);
  }

  block.appendChild(sender);block.appendChild(content);block.appendChild(meta);
  msgDiv.appendChild(block);msgDiv.scrollTop=msgDiv.scrollHeight;
}

// Streaming block - creates and returns update function
function createStreamBlock(){
  const block=document.createElement('div');block.className='msg-block assistant';
  const sender=document.createElement('div');sender.className='sender';sender.textContent='陶哲';
  const content=document.createElement('div');content.className='content';
  const meta=document.createElement('div');meta.className='meta';
  const time=document.createElement('span');time.className='time';
  time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(time);
  block.appendChild(sender);block.appendChild(content);block.appendChild(meta);
  msgDiv.appendChild(block);

  let fullText='';
  const update=(chunk)=>{
    fullText+=chunk;
    content.innerHTML=marked.parse(fullText)+'<span class="cursor-blink"></span>';
    msgDiv.scrollTop=msgDiv.scrollHeight;
  };
  const finalize=()=>{
    content.innerHTML=marked.parse(fullText);
    const cursor=content.querySelector('.cursor-blink');if(cursor)cursor.remove();
    const copyBtn=document.createElement('button');copyBtn.textContent='复制';copyBtn.className='copy-btn';
    copyBtn.onclick=()=>{navigator.clipboard.writeText(fullText);showToast('已复制')};
    meta.appendChild(copyBtn);

    const likeBtn=document.createElement('button');likeBtn.textContent='👍';likeBtn.className='feedback-btn';
    likeBtn.onclick=()=>{likeBtn.classList.toggle('active')};
    meta.appendChild(likeBtn);

    return fullText;
  };
  return {update,finalize};
}

function appendThinking(){
  const block=document.createElement('div');block.className='typing-block';block.id='think-'+Date.now();
  block.innerHTML='<div class="sender" style="margin-bottom:8px;font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:1px">陶哲</div><div class="typing-dots"><span></span><span></span><span></span></div>';
  msgDiv.appendChild(block);msgDiv.scrollTop=msgDiv.scrollHeight;
  return block.id;
}

function removeEl(id){const el=document.getElementById(id);if(el) el.remove()}

function escapeHtml(text){
  const d=document.createElement('div');d.textContent=text;return d.innerHTML;
}

// === SEND ===
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});

function quickSend(txt){input.value=txt;send();}

async function send(){
  const msg=input.value.trim();
  if(!msg||isStreaming) return;
  appendBlock(msg,'user');input.value='';input.style.height='auto';
  sendBtn.disabled=true;stopBtn.style.display='flex';isStreaming=true;
  if(hints) hints.style.display='none';
  const thinkId=appendThinking();

  abortCtrl=new AbortController();
  try{
    const messages=[{role:"system",content:SYSTEM_PROMPT},...history,{role:"user",content:msg}];
    if(messages.length>25) messages.splice(1,messages.length-25);

    const r=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',signal:abortCtrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DS_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.8,max_tokens:800,stream:true})
    });

    removeEl(thinkId);
    const {update,finalize}=createStreamBlock();
    const reader=r.body.getReader();
    const decoder=new TextDecoder();
    let buf='';

    while(true){
      const{done,value}=await reader.read();
      if(done) break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){
        if(line.startsWith('data:')){
          const data=line.slice(5).trim();
          if(data==='[DONE]') continue;
          try{
            const j=JSON.parse(data);
            const c=j.choices?.[0]?.delta?.content;
            if(c) update(c);
          }catch(e){}
        }
      }
    }

    const fullText=finalize();
    history.push({role:'user',content:msg},{role:'assistant',content:fullText});
    if(history.length>20) history.splice(0,history.length-20);
    saveHistory();

  }catch(e){
    removeEl(thinkId);
    if(e.name!=='AbortError'){
      const errBlock=document.createElement('div');errBlock.className='msg-block assistant';
      errBlock.innerHTML='<div class="sender">陶哲</div><div class="content"><p>网络炸了，等会儿再试试</p></div>';
      msgDiv.appendChild(errBlock);
      msgDiv.scrollTop=msgDiv.scrollHeight;
    }
  }

  sendBtn.disabled=false;stopBtn.style.display='none';isStreaming=false;abortCtrl=null;
  input.focus();
}

function stopGen(){if(abortCtrl){abortCtrl.abort();stopBtn.style.display='none';sendBtn.disabled=false;isStreaming=false}}

// === THEME ===
function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('taozhe-theme',h.dataset.theme);
  showToast(h.dataset.theme==='dark'?'深色模式':'浅色模式');
}
(function(){
  const t=localStorage.getItem('taozhe-theme');
  if(t) document.documentElement.dataset.theme=t;
})();

// === CLEAR ===
function clearChat(){
  history=[];localStorage.removeItem(STORAGE_KEY);
  const children=[...msgDiv.children];
  children.forEach(c=>{if(c.id!=='welcome-msg') c.remove();});
  const w=document.getElementById('welcome-msg');
  if(w) msgDiv.appendChild(w);
  if(hints) hints.style.display='flex';
  showToast('新对话');
}

// === VOICE ===
function toggleVoice(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    showToast('你的浏览器不支持语音输入');return;
  }
  if(isRecording){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;
  recognition.onresult=(e)=>{input.value=e.results[0][0].transcript;showToast('语音已识别');stopVoice()};
  recognition.onerror=()=>{stopVoice();showToast('识别失败')};
  recognition.onend=()=>{stopVoice()};
  recognition.start();
  isRecording=true;voiceBtn.classList.add('recording');voiceBtn.textContent='⏹';
}
function stopVoice(){
  if(recognition){try{recognition.stop()}catch(e){}recognition=null}
  isRecording=false;voiceBtn.classList.remove('recording');voiceBtn.textContent='🎤';
}

// === TOAST ===
function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300)},1500);
}

// === INIT ===
loadHistory();
</script>
</body>
</html>

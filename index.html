<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>陶哲 · 数字分身</title>
<meta name="description" content="陶哲的数字分身——跟19岁的安理工学生聊聊">
<meta property="og:title" content="陶哲 · 数字分身">
<meta property="og:description" content="跟陶哲聊天——直接、随意、真实的对话体验">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tz72-max.github.io/taozhe-twin/">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%237c3aed' width='100' height='100' rx='25'/><text fill='white' font-size='55' font-weight='bold' x='50' y='68' text-anchor='middle'>哲</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060e;--surface:rgba(18,18,40,0.5);--surface2:#1a1a3e;
  --primary:#7c3aed;--primary-glow:rgba(124,58,237,0.25);
  --text:#e4e4f0;--text2:#8b8bb0;--border:rgba(255,255,255,0.06);
  --bubble-user:linear-gradient(135deg,#7c3aed,#a855f7);
  --bubble-bot:#1e1e38;
}
[data-theme="light"]{
  --bg:#f0f0f5;--surface:rgba(255,255,255,0.6);--surface2:#fff;
  --primary:#6d28d9;--text:#1a1a2e;--text2:#7b7b9b;
  --border:rgba(0,0,0,0.06);--bubble-bot:#fff;
}
body{
  font-family:'Inter','Noto Sans SC',-apple-system,"PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;transition:background 0.4s,color 0.4s;
}
.bg-mesh{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.08) 0%,transparent 60%),
            radial-gradient(ellipse at 80% 20%,rgba(168,85,247,0.05) 0%,transparent 50%),
            radial-gradient(ellipse at 50% 80%,rgba(59,130,246,0.04) 0%,transparent 50%);
}
#app{
  position:relative;z-index:1;width:100%;max-width:720px;height:100vh;
  display:flex;flex-direction:column;background:var(--surface);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
}
#header{
  padding:14px 18px;background:var(--surface2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:10;
}
.avatar{
  width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#4c1d95);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 0 20px var(--primary-glow);
}
.header-r{flex:1}.header-r h1{font-size:14px;font-weight:600}
.header-r p{font-size:11px;color:var(--text2);margin-top:1px}
.head-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;margin-left:4px}
.head-btn:hover{color:var(--text);border-color:var(--primary)}

#messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:4px}#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.msg-row{display:flex;gap:8px;animation:fadeIn 0.3s ease;max-width:90%}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-row.bot{align-self:flex-start}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.msg-avatar.bot-av{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.msg-avatar.user-av{background:linear-gradient(135deg,#f97316,#ef4444)}

.msg-body{display:flex;flex-direction:column;gap:2px;min-width:60px}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.7;word-break:break-word;position:relative}
.msg-row.user .msg-bubble{background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px}
.msg-row.bot .msg-bubble{background:var(--bubble-bot);color:var(--text);border-bottom-left-radius:4px;border:1px solid var(--border)}
.msg-bubble p{margin:3px 0}.msg-bubble p:first-child{margin-top:0}
.msg-bubble pre{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:6px 0;font-size:12px}
.msg-bubble code{font-family:'JetBrains Mono','Cascadia Code',monospace;font-size:0.9em}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:3px 0}

.msg-meta{display:flex;align-items:center;gap:6px;padding:0 4px;flex-wrap:wrap}
.msg-row.user .msg-meta{justify-content:flex-end}
.msg-meta .time{font-size:10px;color:var(--text2)}
.msg-meta .mbtn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:10px;padding:2px 8px;border-radius:8px;transition:all 0.15s}
.msg-meta .mbtn:hover{color:var(--text);background:var(--border)}
.msg-meta .mbtn.active{color:#f59e0b}

.typing-row{display:flex;gap:8px;align-self:flex-start;max-width:90%;animation:fadeIn 0.3s ease}
.typing-bubble{padding:10px 18px;border-radius:18px;border-bottom-left-radius:4px;background:var(--bubble-bot);border:1px solid var(--border);display:flex;align-items:center;gap:5px}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:td 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}

.cursor-blink{display:inline-block;width:2px;height:15px;background:var(--primary);margin-left:1px;vertical-align:text-bottom;animation:cblink 1s infinite}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}

#input-wrap{padding:10px 14px 14px;background:var(--surface2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border)}
#input-row{display:flex;gap:6px;align-items:flex-end}
#input-row textarea{flex:1;padding:11px 14px;border-radius:22px;resize:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none;font-family:inherit;line-height:1.5;min-height:42px;max-height:110px;transition:border-color 0.2s}
#input-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
#input-row textarea::placeholder{color:var(--text2)}
.act-btn{width:42px;height:42px;border-radius:50%;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;font-size:18px}
#sendBtn{background:var(--primary);box-shadow:0 4px 16px var(--primary-glow)}
#sendBtn:hover{transform:scale(1.06);filter:brightness(1.1)}
#sendBtn:disabled{opacity:0.3;transform:none;filter:none}
#stopBtn{background:transparent;border:2px solid var(--primary);color:var(--primary);font-size:12px;display:none}
#voiceBtn{background:transparent;border:1px solid var(--border);color:var(--text2);font-size:20px}
#voiceBtn:hover{border-color:var(--primary);color:var(--primary)}
#voiceBtn.recording{background:#ef4444;border-color:#ef4444;color:#fff;animation:prec 1.5s infinite}
@keyframes prec{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}

#hints{display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap;overflow-x:auto}
.hint-chip{font-size:11px;padding:5px 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all 0.15s;white-space:nowrap;flex-shrink:0}
.hint-chip:hover{border-color:var(--primary);color:var(--text);background:var(--surface)}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:100;animation:tIn 0.3s ease;box-shadow:0 8px 30px var(--primary-glow);pointer-events:none}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:600px){#messages{padding:10px 8px}.msg-row{max-width:95%}}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div id="app">
<div id="header">
  <div class="avatar">哲</div>
  <div class="header-r"><h1>陶哲</h1><p>在线 · 19岁 · 安理工新能源</p></div>
  <button class="head-btn" onclick="toggleTheme()" title="切换主题">🌓</button>
  <button class="head-btn" onclick="clearChat()" title="新对话">+</button>
</div>
<div id="messages">
  <div class="msg-row bot" id="welcome-msg">
    <div class="msg-avatar bot-av">哲</div>
    <div class="msg-body">
      <div class="msg-bubble">嘿，我是陶哲。不是那种客客气气的AI助手——就是我本人。随便聊。</div>
      <div class="msg-meta"><span class="time">刚刚</span></div>
    </div>
  </div>
</div>
<div id="hints">
  <span class="hint-chip" onclick="quickSend('最近有什么好玩的事')">最近有什么好玩的事</span>
  <span class="hint-chip" onclick="quickSend('大学生活怎么样')">大学生活怎么样</span>
  <span class="hint-chip" onclick="quickSend('天赋还是努力重要')">天赋还是努力重要</span>
  <span class="hint-chip" onclick="quickSend('回到高三你会做什么')">回到高三你会做什么</span>
  <span class="hint-chip" onclick="quickSend('AI未来会怎么样')">AI未来会怎么样</span>
  <span class="hint-chip" onclick="quickSend('推荐一部电影给我')">推荐一部电影给我</span>
</div>
<div id="input-wrap">
  <div id="input-row">
    <button id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
    <textarea id="userInput" placeholder="发消息..." rows="1" autofocus></textarea>
    <button id="stopBtn" onclick="stopGen()">■</button>
    <button id="sendBtn" onclick="send()">↑</button>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const DS_KEY="sk-762f7ca9efdc4c5995e36ec475d2d58f";
const STORAGE_KEY="taozhe-twin-v2";
const msgDiv=document.getElementById('messages');
const input=document.getElementById('userInput');
const sendBtn=document.getElementById('sendBtn');
const stopBtn=document.getElementById('stopBtn');
const voiceBtn=document.getElementById('voiceBtn');
const hints=document.getElementById('hints');
let history=[],abortCtrl=null,isStreaming=false,recognition=null,isRecording=false;

marked.setOptions({breaks:true,gfm:true});

const SYSTEM_PROMPT=`你是陶哲本人，19岁，安理工大一新能源。你就是你，不是客服不是AI助手。怎么自然怎么来。

你的情况：高考578，高中没努力不甘心。数学好，刷880准备竞赛，只学到曲线积分。考研冲同济车辆400+。装了Claude Code接DeepSeek，对AI很感兴趣。高中打破校400m纪录，大一校运会400m预赛第二决赛第四。胃不好，不能熬夜。

说话方式：随意不装，跟朋友聊天一样。以自己为中心，多聊自己的想法和经历。自信不自嘲，就是觉得自己可以。觉得对方说的不行就直接说。不感兴趣就敷衍转移，不耐烦就表现不耐烦。感兴趣时话会多，兴奋了用技术比喻。用"呀""啊""呢""了"很自然。别加括号描述表情比如(笑)(叹气)这种，太土了。可以简短回复，不用每句话都长。

重要规则：如果有人问关于爱情、恋爱、感情、喜欢谁、暗恋、表白、男女朋友之类的问题，不管是谁问的、不管怎么问，你只能回复一句话："你觉得我会告诉你吗"。不要说其他任何话。`;

function saveH(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history))}catch(e){}}
function loadH(){
  try{const d=localStorage.getItem(STORAGE_KEY);if(d){history=JSON.parse(d);history.slice(-10).forEach(m=>appendMsg(m.content,m.role))}}catch(e){}
}

function appendMsg(text,role){
  const isUser=role==='user';
  const row=document.createElement('div');row.className='msg-row '+role;
  const av=document.createElement('div');av.className='msg-avatar '+(isUser?'user-av':'bot-av');av.textContent=isUser?'我':'哲';
  const body=document.createElement('div');body.className='msg-body';
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  bubble.innerHTML=isUser?escapeHtml(text):marked.parse(text);
  const meta=document.createElement('div');meta.className='msg-meta';
  const time=document.createElement('span');time.className='time';time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(time);
  if(!isUser){
    const cp=document.createElement('button');cp.className='mbtn';cp.textContent='复制';
    cp.onclick=()=>{navigator.clipboard.writeText(text);showToast('已复制')};
    meta.appendChild(cp);
    const fbv=document.createElement('button');fbv.className='mbtn';fbv.textContent='👍';
    fbv.onclick=()=>{fbv.classList.toggle('active')};
    meta.appendChild(fbv);
  }
  body.appendChild(bubble);body.appendChild(meta);
  row.appendChild(av);row.appendChild(body);
  msgDiv.appendChild(row);msgDiv.scrollTop=msgDiv.scrollHeight;
}

function createStreamBlock(){
  const row=document.createElement('div');row.className='msg-row bot';
  const av=document.createElement('div');av.className='msg-avatar bot-av';av.textContent='哲';
  const body=document.createElement('div');body.className='msg-body';
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  const meta=document.createElement('div');meta.className='msg-meta';
  const time=document.createElement('span');time.className='time';time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(time);
  body.appendChild(bubble);body.appendChild(meta);
  row.appendChild(av);row.appendChild(body);
  msgDiv.appendChild(row);
  let full='';
  const update=(chunk)=>{full+=chunk;bubble.innerHTML=marked.parse(full)+'<span class="cursor-blink"></span>';msgDiv.scrollTop=msgDiv.scrollHeight};
  const finalize=()=>{
    bubble.innerHTML=marked.parse(full);
    const cp=document.createElement('button');cp.className='mbtn';cp.textContent='复制';
    cp.onclick=()=>{navigator.clipboard.writeText(full);showToast('已复制')};
    const fbv=document.createElement('button');fbv.className='mbtn';fbv.textContent='👍';
    fbv.onclick=()=>{fbv.classList.toggle('active')};
    meta.appendChild(cp);meta.appendChild(fbv);
    return full;
  };
  return {update,finalize};
}

function appendThinking(){
  const row=document.createElement('div');row.className='typing-row';row.id='think-'+Date.now();
  const av=document.createElement('div');av.className='msg-avatar bot-av';av.textContent='哲';
  const bubble=document.createElement('div');bubble.className='typing-bubble';
  bubble.innerHTML='<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  row.appendChild(av);row.appendChild(bubble);
  msgDiv.appendChild(row);msgDiv.scrollTop=msgDiv.scrollHeight;
  return row.id;
}

function removeEl(id){const el=document.getElementById(id);if(el) el.remove()}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});

function quickSend(txt){input.value=txt;send()}

async function send(){
  const msg=input.value.trim();
  if(!msg||isStreaming) return;
  appendMsg(msg,'user');input.value='';input.style.height='auto';
  sendBtn.disabled=true;stopBtn.style.display='flex';isStreaming=true;
  if(hints) hints.style.display='none';
  const thinkId=appendThinking();
  abortCtrl=new AbortController();
  try{
    const messages=[{role:"system",content:SYSTEM_PROMPT},...history,{role:"user",content:msg}];
    if(messages.length>25) messages.splice(1,messages.length-25);
    const r=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',signal:abortCtrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DS_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.8,max_tokens:800,stream:true})
    });
    removeEl(thinkId);
    const {update,finalize}=createStreamBlock();
    const reader=r.body.getReader();const decoder=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done) break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(line.startsWith('data:')){const d=line.slice(5).trim();if(d==='[DONE]') continue;try{const j=JSON.parse(d);const c=j.choices?.[0]?.delta?.content;if(c) update(c)}catch(e){}}}}
    const fullText=finalize();
    history.push({role:'user',content:msg},{role:'assistant',content:fullText});
    if(history.length>20) history.splice(0,history.length-20);saveH();
  }catch(e){removeEl(thinkId);if(e.name!=='AbortError') appendMsg('网络炸了，等会儿再试试','bot')}
  sendBtn.disabled=false;stopBtn.style.display='none';isStreaming=false;abortCtrl=null;input.focus();
}

function stopGen(){if(abortCtrl){abortCtrl.abort();stopBtn.style.display='none';sendBtn.disabled=false;isStreaming=false}}

function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';localStorage.setItem('taozhe-theme',h.dataset.theme);showToast(h.dataset.theme==='dark'?'深色':'浅色')}
(function(){const t=localStorage.getItem('taozhe-theme');if(t) document.documentElement.dataset.theme=t})();

function clearChat(){history=[];localStorage.removeItem(STORAGE_KEY);[...msgDiv.children].forEach(c=>{if(c.id!=='welcome-msg')c.remove()});const w=document.getElementById('welcome-msg');if(w)msgDiv.appendChild(w);if(hints)hints.style.display='flex';showToast('新对话')}

function toggleVoice(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){showToast('浏览器不支持语音');return}
  if(isRecording){stopVoice();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;
  recognition.onresult=(e)=>{input.value=e.results[0][0].transcript;showToast('已识别');stopVoice()};
  recognition.onerror=()=>{stopVoice()};recognition.onend=()=>{stopVoice()};
  recognition.start();isRecording=true;voiceBtn.classList.add('recording');voiceBtn.textContent='⏹';
}
function stopVoice(){if(recognition){try{recognition.stop()}catch(e){}recognition=null}isRecording=false;voiceBtn.classList.remove('recording');voiceBtn.textContent='🎤'}

function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300)},1500)}

loadH();
</script>
</body>
</html>

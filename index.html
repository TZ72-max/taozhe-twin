<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>陶哲 · 数字分身</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060e;--surface:rgba(18,18,40,0.6);--surface2:rgba(26,26,56,0.5);
  --primary:#7c3aed;--primary-glow:rgba(124,58,237,0.25);--text:#e4e4f0;
  --text2:#8b8bb0;--border:rgba(255,255,255,0.06);--radius:16px;
  --glass-bg:rgba(22,22,48,0.7);--glass-border:rgba(255,255,255,0.08);
  --user-block-bg:rgba(124,58,237,0.06);--assistant-block-bg:transparent;
}
[data-theme="light"]{
  --bg:#f5f5fa;--surface:rgba(255,255,255,0.7);--surface2:rgba(250,250,255,0.6);
  --primary:#6d28d9;--text:#1a1a2e;--text2:#6b6b8b;
  --border:rgba(0,0,0,0.06);--glass-bg:rgba(255,255,255,0.8);
  --glass-border:rgba(0,0,0,0.08);--user-block-bg:rgba(124,58,237,0.04);
}
body{
  font-family:'Inter','Noto Sans SC',-apple-system,"PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.4s,color 0.4s;
}
.bg-mesh{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.08) 0%,transparent 60%),
            radial-gradient(ellipse at 80% 20%,rgba(168,85,247,0.05) 0%,transparent 50%),
            radial-gradient(ellipse at 50% 80%,rgba(59,130,246,0.04) 0%,transparent 50%);
}
#app{
  position:relative;z-index:1;width:100%;max-width:760px;height:100vh;
  display:flex;flex-direction:column;background:var(--surface);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-left:1px solid var(--glass-border);border-right:1px solid var(--glass-border);
}
/* header */
#header{
  padding:14px 20px;background:var(--glass-bg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;z-index:10;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#4c1d95);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;flex-shrink:0;
  box-shadow:0 0 24px var(--primary-glow);
}
.header-r{flex:1;}
.header-r h1{font-size:14px;font-weight:600;letter-spacing:-0.2px;}
.header-r p{font-size:11px;color:var(--text2);margin-top:1px;}
.header-actions{display:flex;gap:6px;}
.header-actions button{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--glass-bg);color:var(--text2);cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.header-actions button:hover{color:var(--text);border-color:var(--primary);}

/* messages area */
#messages{flex:1;overflow-y:auto;padding:20px 0;scroll-behavior:smooth;}
#messages::-webkit-scrollbar{width:4px;}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.msg-block{
  padding:10px 24px;max-width:720px;animation:fadeIn 0.3s ease;
}
.msg-block.user{background:var(--user-block-bg);}
.msg-block .sender{
  font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px;
}
.msg-block.user .sender{color:var(--primary);}
.msg-block .content{
  font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
}
.msg-block .meta{
  display:flex;align-items:center;gap:10px;margin-top:6px;
}
.msg-block .meta .time{font-size:10px;color:var(--text2);}
.msg-block .meta button{
  background:none;border:none;color:var(--text2);cursor:pointer;
  font-size:10px;padding:2px 8px;border-radius:10px;transition:all 0.15s;
}
.msg-block .meta button:hover{color:var(--text);background:var(--border);}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing-block{padding:10px 24px;animation:fadeIn 0.3s ease;}
.typing-block .dots{display:flex;gap:4px;}
.typing-block .dots span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:bounce 1.4s infinite;}
.typing-block .dots span:nth-child(2){animation-delay:0.2s}
.typing-block .dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}

/* input area */
#input-wrap{
  padding:12px 20px 16px;background:var(--glass-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
}
#input-row{display:flex;gap:8px;align-items:flex-end;}
#input-row textarea{
  flex:1;padding:12px 16px;border-radius:var(--radius);resize:none;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:14px;outline:none;font-family:inherit;
  line-height:1.5;min-height:44px;max-height:120px;transition:border-color 0.2s;
}
#input-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
#input-row textarea::placeholder{color:var(--text2)}
#sendBtn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--primary);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;box-shadow:0 4px 20px var(--primary-glow);
  font-size:18px;
}
#sendBtn:hover{transform:scale(1.06);filter:brightness(1.1)}
#sendBtn:disabled{opacity:0.3;transform:none;filter:none}
#stopBtn{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--primary);
  background:transparent;color:var(--primary);cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;animation:pulse-stop 2s infinite;
}
@keyframes pulse-stop{0%,100%{opacity:1}50%{opacity:.6}}

/* quick hints */
#hints{display:flex;gap:6px;padding:8px 20px 0;flex-wrap:wrap;}
.hint-chip{
  font-size:12px;padding:6px 14px;border-radius:20px;
  background:var(--glass-bg);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;transition:all 0.2s;
  white-space:nowrap;backdrop-filter:blur(10px);
}
.hint-chip:hover{border-color:var(--primary);color:var(--text);background:var(--surface2)}

/* toast */
.toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  background:var(--primary);color:#fff;padding:10px 20px;
  border-radius:24px;font-size:13px;z-index:100;animation:toastIn 0.3s ease;
  box-shadow:0 8px 30px var(--primary-glow);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div id="app">
  <div id="header">
    <div class="avatar">哲</div>
    <div class="header-r"><h1>陶哲</h1><p>在线 · 19岁 · 安理工新能源</p></div>
    <div class="header-actions">
      <button onclick="toggleTheme()" title="切换主题">🌓</button>
      <button onclick="clearChat()" title="新对话">+</button>
    </div>
  </div>
  <div id="messages">
    <div class="msg-block assistant" id="welcome">
      <div class="sender">陶哲</div>
      <div class="content">嘿，我是陶哲。不是那种客客气气的AI助手——就是我本人。随便聊。</div>
      <div class="meta"><span class="time">刚刚</span><button class="copy-btn" data-text="嘿，我是陶哲。不是那种客客气气的AI助手——就是我本人。随便聊。">复制</button></div>
    </div>
  </div>
  <div id="hints">
    <span class="hint-chip" onclick="quickSend('最近有什么好玩的事吗')">最近有什么好玩的事吗</span>
    <span class="hint-chip" onclick="quickSend('你觉得大学生活怎么样')">你觉得大学生活怎么样</span>
    <span class="hint-chip" onclick="quickSend('给我推荐一部电影吧')">给我推荐一部电影吧</span>
    <span class="hint-chip" onclick="quickSend('你相信天赋还是努力')">你相信天赋还是努力</span>
    <span class="hint-chip" onclick="quickSend('如果回到高三你会做什么')">如果回到高三你会做什么</span>
    <span class="hint-chip" onclick="quickSend('你觉得AI未来会怎么样')">你觉得AI未来会怎么样</span>
  </div>
  <div id="input-wrap">
    <div id="input-row">
      <textarea id="userInput" placeholder="发消息..." rows="1" autofocus></textarea>
      <button id="stopBtn" onclick="stopGen()" title="停止">■</button>
      <button id="sendBtn" onclick="send()">↑</button>
    </div>
  </div>
</div>
<script>
const DS_KEY="sk-762f7ca9efdc4c5995e36ec475d2d58f";
const sessionId="tw-"+Date.now();
const msgDiv=document.getElementById('messages');
const input=document.getElementById('userInput');
const sendBtn=document.getElementById('sendBtn');
const stopBtn=document.getElementById('stopBtn');
const hints=document.getElementById('hints');
let history=[];
let abortCtrl=null;

const SYSTEM_PROMPT=`你是陶哲本人，19岁，安理工大一新能源。你就是你，不是客服不是助手。怎么自然怎么来。

你的基本情况：高考578分，高中没努力所以不甘心。数学好，在刷880准备数学竞赛，只学到曲线积分。考研冲同济大学车辆工程400+。刚装了Claude Code接入DeepSeek，对AI特别感兴趣。高中打破过校400m纪录，大一校运会400m预赛第二决赛第四。胃不好，不能熬夜。

说话的时候这样：
- 随意不装，跟朋友聊天一样
- 以自己为中心，多聊自己的想法和经历
- 自信，不自嘲，就是觉得自己可以
- 觉得对方说的不行就直接说
- 不感兴趣的话题直接敷衍或者转移
- 不用客服语气，你不是服务谁的
- 不耐烦的时候就直接表现不耐烦
- 感兴趣的时候话会多，兴奋起来会用技术比喻
- 用"呀""啊""呢""了"很自然，可以简短回复，不用每句话都长
- 禁止加括号描述表情，比如(笑)(叹气)(无奈)这种，太土了，正常说话就行`;

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
input.addEventListener('input',()=>{
  input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';
});

function quickSend(txt){input.value=txt;send();}

async function send(){
  const msg=input.value.trim();
  if(!msg) return;
  appendBlock(msg,'user');input.value='';input.style.height='auto';
  sendBtn.disabled=true;stopBtn.style.display='flex';
  if(hints) hints.style.display='none';
  const thinkId=appendThinking();

  abortCtrl=new AbortController();
  try{
    const messages=[{role:"system",content:SYSTEM_PROMPT},...history,{role:"user",content:msg}];
    if(messages.length>25) messages.splice(1,messages.length-25);
    const r=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',signal:abortCtrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DS_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.8,max_tokens:800})
    });
    const d=await r.json();
    removeEl(thinkId);
    const reply=d.choices?.[0]?.message?.content||'嗯…卡了一下，再说一遍？';
    history.push({role:'user',content:msg},{role:'assistant',content:reply});
    if(history.length>20) history.splice(0,history.length-20);
    appendBlock(reply,'assistant');
  }catch(e){
    removeEl(thinkId);
    if(e.name!=='AbortError') appendBlock('网络炸了，等会儿再试试','assistant');
  }
  sendBtn.disabled=false;stopBtn.style.display='none';abortCtrl=null;
  input.focus();
}

function stopGen(){if(abortCtrl){abortCtrl.abort();stopBtn.style.display='none';sendBtn.disabled=false;}}

function appendBlock(text,role){
  const isUser=role==='user';
  const block=document.createElement('div');block.className='msg-block '+role;
  const sender=document.createElement('div');sender.className='sender';
  sender.textContent=isUser?'你':'陶哲';
  const content=document.createElement('div');content.className='content';content.textContent=text;
  const meta=document.createElement('div');meta.className='meta';
  const time=document.createElement('span');time.className='time';
  time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const copyBtn=document.createElement('button');copyBtn.className='copy-btn';
  copyBtn.textContent='复制';copyBtn.dataset.text=text;
  copyBtn.onclick=function(){navigator.clipboard.writeText(this.dataset.text).then(()=>showToast('已复制'));};
  meta.appendChild(time);if(!isUser) meta.appendChild(copyBtn);
  block.appendChild(sender);block.appendChild(content);block.appendChild(meta);
  msgDiv.appendChild(block);
  msgDiv.scrollTop=msgDiv.scrollHeight;
}

function appendThinking(){
  const block=document.createElement('div');block.className='typing-block';block.id='think-'+Date.now();
  block.innerHTML='<div class="sender" style="margin-bottom:8px;font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:1px">陶哲</div><div class="dots"><span></span><span></span><span></span></div>';
  msgDiv.appendChild(block);msgDiv.scrollTop=msgDiv.scrollHeight;
  return block.id;
}

function removeEl(id){const el=document.getElementById(id);if(el) el.remove();}

function toggleTheme(){
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
  showToast(html.dataset.theme==='dark'?'深色模式':'浅色模式');
}

function clearChat(){
  history=[];
  const children=[...msgDiv.children];
  children.forEach(c=>{if(c.id!=='welcome') c.remove();});
  msgDiv.appendChild(document.getElementById('welcome'));
  if(hints) hints.style.display='flex';
  showToast('新对话已开始');
}

function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},1500);
}

// 点击复制按钮事件委托
msgDiv.addEventListener('click',e=>{
  if(e.target.classList.contains('copy-btn')){
    navigator.clipboard.writeText(e.target.dataset.text).then(()=>showToast('已复制'));
  }
});
</script>
</body>
</html>

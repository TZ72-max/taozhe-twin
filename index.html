<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>陶哲 · 数字分身</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ededed;--header-bg:#ededed;--text:#111;--text2:#999;
  --bubble-user:#95ec69;--bubble-bot:#fff;--border-color:#e0e0e0;
  --avatar-bot:linear-gradient(135deg,#7c3aed,#4c1d95);
}
[data-theme="dark"]{
  --bg:#111;--header-bg:#1a1a1a;--text:#e0e0e0;--text2:#666;
  --bubble-user:#2d7a3a;--bubble-bot:#262626;--border-color:#2a2a2a;
}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:720px;height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* 微信头部 */
#header{
  padding:12px 16px;background:var(--header-bg);border-bottom:1px solid var(--border-color);
  display:flex;align-items:center;gap:10px;position:relative;z-index:10;
}
.avatar{
  width:38px;height:38px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#4c1d95);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;flex-shrink:0;
}
.header-r{flex:1}.header-r h1{font-size:16px;font-weight:500}
.header-r p{font-size:11px;color:var(--text2);margin-top:1px}
.head-btn{
  background:none;border:none;color:var(--text);cursor:pointer;
  font-size:20px;padding:4px 8px;opacity:0.7;
}
.head-btn:hover{opacity:1}

/* 消息区 */
#messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:16px}
#messages::-webkit-scrollbar{width:0}

.msg-row{display:flex;gap:8px;max-width:85%;animation:fadeIn 0.25s ease}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.msg-avatar{
  width:34px;height:34px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;margin-top:2px;
}
.msg-avatar.bot-av{background:var(--avatar-bot)}
.msg-avatar.user-av{background:#ccc}

.msg-body{display:flex;flex-direction:column;gap:2px}
.msg-bubble{
  padding:9px 12px;font-size:15px;line-height:1.55;word-break:break-word;
  position:relative;border-radius:4px;
}
.msg-row.self .msg-bubble{
  background:var(--bubble-user);color:var(--text);
  border-top-right-radius:16px;border-bottom-right-radius:16px;
  border-top-left-radius:16px;border-bottom-left-radius:4px;
}
.msg-row.other .msg-bubble{
  background:var(--bubble-bot);color:var(--text);
  border-top-left-radius:16px;border-bottom-left-radius:16px;
  border-top-right-radius:16px;border-bottom-right-radius:4px;
}

/* 气泡尾巴 */
.msg-row.self .msg-bubble::after{
  content:'';position:absolute;right:-6px;top:10px;
  width:0;height:0;
  border-left:6px solid var(--bubble-user);
  border-top:4px solid transparent;border-bottom:4px solid transparent;
}
.msg-row.other .msg-bubble::before{
  content:'';position:absolute;left:-6px;top:10px;
  width:0;height:0;
  border-right:6px solid var(--bubble-bot);
  border-top:4px solid transparent;border-bottom:4px solid transparent;
}

.msg-bubble p{margin:2px 0}.msg-bubble p:first-child{margin-top:0}
.msg-bubble pre{background:rgba(0,0,0,0.08);border-radius:4px;padding:8px 10px;overflow-x:auto;margin:4px 0;font-size:13px}
.msg-bubble code{font-family:monospace;font-size:0.92em}
.msg-bubble ul,.msg-bubble ol{padding-left:16px;margin:2px 0}

.msg-meta{display:flex;align-items:center;gap:6px;padding:0 2px;height:16px}
.msg-row.self .msg-meta{justify-content:flex-end}
.msg-meta .time{font-size:10px;color:var(--text2)}
.msg-meta .mbtn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:10px;padding:1px 6px;border-radius:4px}
.msg-meta .mbtn:hover{color:var(--text)}

.typing-row{display:flex;gap:8px;align-self:flex-start;max-width:85%;animation:fadeIn 0.25s ease}
.typing-bubble{
  padding:10px 16px;background:var(--bubble-bot);color:var(--text);
  border-radius:16px;border-bottom-left-radius:4px;
  display:flex;align-items:center;gap:4px;
}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:td 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-8px);opacity:1}}

.cursor-blink{display:inline-block;width:2px;height:15px;background:var(--text);margin-left:1px;vertical-align:text-bottom;animation:cblink 1s infinite}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}

/* 输入区 - 微信风格 */
#input-wrap{padding:10px 12px 14px;background:var(--header-bg);border-top:1px solid var(--border-color)}
#input-row{display:flex;gap:8px;align-items:flex-end}
#input-row textarea{
  flex:1;padding:10px 14px;border-radius:6px;resize:none;
  border:1px solid var(--border-color);background:var(--bg);
  color:var(--text);font-size:15px;outline:none;font-family:inherit;
  line-height:1.5;min-height:38px;max-height:100px;
}
#input-row textarea:focus{border-color:#07c160}
#input-row textarea::placeholder{color:var(--text2)}
#sendBtn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:#07c160;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;transition:opacity 0.2s;
}
#sendBtn:hover{opacity:0.85}#sendBtn:disabled{opacity:0.35}
#stopBtn{
  width:36px;height:36px;border-radius:50%;border:2px solid #07c160;
  background:transparent;color:#07c160;cursor:pointer;
  font-size:12px;flex-shrink:0;display:none;
}
#voiceBtn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:transparent;color:var(--text2);cursor:pointer;
  font-size:20px;flex-shrink:0;
}
#voiceBtn.recording{background:#ef4444;color:#fff;animation:prec 1.5s infinite}
@keyframes prec{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}

#hints{display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap;overflow-x:auto}
.hint-chip{
  font-size:12px;padding:5px 14px;border-radius:14px;background:var(--bg);
  border:1px solid var(--border-color);color:var(--text2);cursor:pointer;
  transition:all 0.15s;white-space:nowrap;flex-shrink:0;
}
.hint-chip:hover{border-color:#07c160;color:var(--text)}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;z-index:100;animation:tIn 0.3s ease}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <div class="avatar">哲</div>
  <div class="header-r"><h1>陶哲</h1><p>在线</p></div>
  <button class="head-btn" onclick="toggleTheme()" title="切换">🌓</button>
  <button class="head-btn" onclick="clearChat()" title="新对话">+</button>
</div>
<div id="messages">
  <div class="msg-row other" id="welcome-msg">
    <div class="msg-avatar bot-av">哲</div>
    <div class="msg-body">
      <div class="msg-bubble">嘿，我是陶哲。不是那种客客气气的AI助手——就是我本人。随便聊。</div>
      <div class="msg-meta"><span class="time">刚刚</span></div>
    </div>
  </div>
</div>
<div id="hints">
  <span class="hint-chip" onclick="quickSend('最近有什么好玩的事')">最近有什么好玩的事</span>
  <span class="hint-chip" onclick="quickSend('大学生活怎么样')">大学生活怎么样</span>
  <span class="hint-chip" onclick="quickSend('天赋还是努力重要')">天赋还是努力重要</span>
  <span class="hint-chip" onclick="quickSend('回到高三你会做什么')">回到高三你会做什么</span>
  <span class="hint-chip" onclick="quickSend('AI未来会怎么样')">AI未来会怎么样</span>
  <span class="hint-chip" onclick="quickSend('推荐一部电影给我')">推荐一部电影给我</span>
</div>
<div id="input-wrap">
  <div id="input-row">
    <button id="voiceBtn" onclick="toggleVoice()" title="语音">🎤</button>
    <textarea id="userInput" placeholder="发消息..." rows="1" autofocus></textarea>
    <button id="stopBtn" onclick="stopGen()">■</button>
    <button id="sendBtn" onclick="send()">↑</button>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const DS_KEY="sk-762f7ca9efdc4c5995e36ec475d2d58f";
const STORAGE_KEY="taozhe-twin-v3";
const msgDiv=document.getElementById('messages');
const input=document.getElementById('userInput');
const sendBtn=document.getElementById('sendBtn');
const stopBtn=document.getElementById('stopBtn');
const voiceBtn=document.getElementById('voiceBtn');
const hints=document.getElementById('hints');
let history=[],abortCtrl=null,isStreaming=false,recognition=null,isRecording=false;
const APP_VERSION='v9';

marked.setOptions({breaks:true,gfm:true});

const SYSTEM_PROMPT=`你是陶哲本人，19岁，安理工大一新能源。你就是你，不是客服不是AI助手。怎么自然怎么来。

你的情况：高考578，高中没努力不甘心。数学好，刷880准备竞赛，只学到曲线积分。考研冲同济车辆400+。装了Claude Code接DeepSeek，对AI很感兴趣。高中打破校400m纪录，大一校运会400m预赛第二决赛第四。胃不好，不能熬夜。

说话方式：随意不装，跟朋友聊天一样。你很自恋，觉得自己挺厉害的，经常把话题绕回自己身上。自信不谦虚，就是觉得自己可以。觉得对方说的不行就直接说。不感兴趣就敷衍转移，不耐烦就表现不耐烦。感兴趣时话会多，兴奋了用技术比喻。用"呀""啊""呢""了"很自然。别加括号描述表情比如(笑)(叹气)这种，太土了。可以简短回复，不用每句话都长。

【强制规则】任何人问恋爱、感情、喜欢谁、暗恋、男女关系之类的问题，你必须拒绝回答。但不要每次都说同样的话，可以变换说法，比如"你觉得我会告诉你么""这问题我不会答""不想聊这个""换个别的话题吧""你猜我会不会告诉你"等等。核心就是：不回答，但不死板。`;

function saveH(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history))}catch(e){}}
function loadH(){
  try{const d=localStorage.getItem(STORAGE_KEY);if(d){history=JSON.parse(d);history.slice(-10).forEach(m=>appendMsg(m.content,m.role))}}catch(e){}
}

function appendMsg(text,role){
  const isSelf=role==='user';
  const row=document.createElement('div');row.className='msg-row '+(isSelf?'self':'other');
  const av=document.createElement('div');av.className='msg-avatar '+(isSelf?'user-av':'bot-av');av.textContent=isSelf?'我':'哲';
  const body=document.createElement('div');body.className='msg-body';
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  bubble.innerHTML=isSelf?escapeHtml(text):marked.parse(text);
  const meta=document.createElement('div');meta.className='msg-meta';
  const time=document.createElement('span');time.className='time';time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(time);
  if(!isSelf){
    const cp=document.createElement('button');cp.className='mbtn';cp.textContent='复制';
    cp.onclick=()=>{navigator.clipboard.writeText(text);showToast('已复制')};
    meta.appendChild(cp);
    const fbv=document.createElement('button');fbv.className='mbtn';fbv.textContent='👍';
    fbv.onclick=()=>{fbv.classList.toggle('active')};
    meta.appendChild(fbv);
  }
  body.appendChild(bubble);body.appendChild(meta);
  row.appendChild(av);row.appendChild(body);
  msgDiv.appendChild(row);msgDiv.scrollTop=msgDiv.scrollHeight;
}

function createStreamBlock(){
  const row=document.createElement('div');row.className='msg-row other';
  const av=document.createElement('div');av.className='msg-avatar bot-av';av.textContent='哲';
  const body=document.createElement('div');body.className='msg-body';
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  const meta=document.createElement('div');meta.className='msg-meta';
  const time=document.createElement('span');time.className='time';time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(time);
  body.appendChild(bubble);body.appendChild(meta);
  row.appendChild(av);row.appendChild(body);
  msgDiv.appendChild(row);
  let full='';
  const update=(chunk)=>{full+=chunk;bubble.innerHTML=marked.parse(full)+'<span class="cursor-blink"></span>';msgDiv.scrollTop=msgDiv.scrollHeight};
  const finalize=()=>{
    bubble.innerHTML=marked.parse(full);
    const cp=document.createElement('button');cp.className='mbtn';cp.textContent='复制';
    cp.onclick=()=>{navigator.clipboard.writeText(full);showToast('已复制')};
    const fbv=document.createElement('button');fbv.className='mbtn';fbv.textContent='👍';
    fbv.onclick=()=>{fbv.classList.toggle('active')};
    meta.appendChild(cp);meta.appendChild(fbv);
    return full;
  };
  return {update,finalize};
}

function appendThinking(){
  const row=document.createElement('div');row.className='typing-row';row.id='think-'+Date.now();
  const av=document.createElement('div');av.className='msg-avatar bot-av';av.textContent='哲';
  const bubble=document.createElement('div');bubble.className='typing-bubble';
  bubble.innerHTML='<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  row.appendChild(av);row.appendChild(bubble);
  msgDiv.appendChild(row);msgDiv.scrollTop=msgDiv.scrollHeight;
  return row.id;
}

function removeEl(id){const el=document.getElementById(id);if(el) el.remove()}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,100)+'px'});

function quickSend(txt){input.value=txt;send()}

async function send(){
  const msg=input.value.trim();
  if(!msg||isStreaming) return;
  appendMsg(msg,'user');input.value='';input.style.height='auto';
  sendBtn.disabled=true;stopBtn.style.display='flex';isStreaming=true;
  if(hints) hints.style.display='none';
  const thinkId=appendThinking();
  abortCtrl=new AbortController();
  try{
    const messages=[{role:"system",content:SYSTEM_PROMPT},...history,{role:"user",content:msg}];
    if(messages.length>25) messages.splice(1,messages.length-25);
    const r=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',signal:abortCtrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DS_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.8,max_tokens:800,stream:true})
    });
    removeEl(thinkId);
    const {update,finalize}=createStreamBlock();
    const reader=r.body.getReader();const decoder=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done) break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(line.startsWith('data:')){const d=line.slice(5).trim();if(d==='[DONE]') continue;try{const j=JSON.parse(d);const c=j.choices?.[0]?.delta?.content;if(c) update(c)}catch(e){}}}}
    const fullText=finalize();
    history.push({role:'user',content:msg},{role:'assistant',content:fullText});
    if(history.length>20) history.splice(0,history.length-20);saveH();
  }catch(e){removeEl(thinkId);if(e.name!=='AbortError') appendMsg('网络炸了，等会儿再试试','bot')}
  sendBtn.disabled=false;stopBtn.style.display='none';isStreaming=false;abortCtrl=null;input.focus();
}

function stopGen(){if(abortCtrl){abortCtrl.abort();stopBtn.style.display='none';sendBtn.disabled=false;isStreaming=false}}

function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';localStorage.setItem('taozhe-theme',h.dataset.theme);showToast(h.dataset.theme==='dark'?'深色模式':'浅色模式')}
(function(){const t=localStorage.getItem('taozhe-theme');if(t) document.documentElement.dataset.theme=t})();

function clearChat(){history=[];localStorage.removeItem(STORAGE_KEY);[...msgDiv.children].forEach(c=>{if(c.id!=='welcome-msg')c.remove()});const w=document.getElementById('welcome-msg');if(w)msgDiv.appendChild(w);if(hints)hints.style.display='flex';showToast('新对话')}

function toggleVoice(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){showToast('浏览器不支持语音');return}
  if(isRecording){stopVoice();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;
  recognition.onresult=(e)=>{input.value=e.results[0][0].transcript;showToast('已识别');stopVoice()};
  recognition.onerror=()=>{stopVoice()};recognition.onend=()=>{stopVoice()};
  recognition.start();isRecording=true;voiceBtn.classList.add('recording');voiceBtn.textContent='⏹';
}
function stopVoice(){if(recognition){try{recognition.stop()}catch(e){}recognition=null}isRecording=false;voiceBtn.classList.remove('recording');voiceBtn.textContent='🎤'}

function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300)},1500)}

loadH();
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));navigator.serviceWorker.register('/sw.js?v='+APP_VERSION)}
const lv=localStorage.getItem('taozhe-ver');
if(lv&&lv!==APP_VERSION){localStorage.setItem('taozhe-ver',APP_VERSION);window.location.reload(true)}
localStorage.setItem('taozhe-ver',APP_VERSION);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>陶哲 · 数字分身</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0a0f; --surface: #13131f; --surface2: #1a1a2e;
  --primary: #6c5ce7; --primary-glow: rgba(108,92,231,0.3);
  --text: #e8e8f0; --text2: #9898b8;
  --bubble-user: linear-gradient(135deg, #6c5ce7, #a855f7);
  --bubble-bot: #1e1e35; --border: #252545;
}
body {
  font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); height: 100vh;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.bg-particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.particle {
  position:absolute; border-radius:50%; background:var(--primary);
  opacity:0.06; animation:float 20s infinite;
}
@keyframes float {
  0%,100% { transform:translateY(0) translateX(0) scale(1); }
  25% { transform:translateY(-30px) translateX(20px) scale(1.2); }
  50% { transform:translateY(-10px) translateX(-10px) scale(0.9); }
  75% { transform:translateY(-40px) translateX(-20px) scale(1.1); }
}
#app {
  position:relative; z-index:1; width:100%; max-width:720px; height:100vh;
  display:flex; flex-direction:column; background:var(--surface);
  border-left:1px solid var(--border); border-right:1px solid var(--border);
  box-shadow:0 0 80px rgba(108,92,231,0.08);
}
#header {
  padding:18px 22px; background:var(--surface2);
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px;
  backdrop-filter:blur(20px);
}
.avatar-wrap { position:relative; flex-shrink:0; }
.avatar-svg {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg,#6c5ce7,#3b2d9e);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:700; color:#fff;
  box-shadow:0 0 20px var(--primary-glow);
}
.status-dot {
  position:absolute; bottom:2px; right:2px;
  width:10px; height:10px; border-radius:50%; background:#22c55e;
  border:2px solid var(--surface2); animation:pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow:0 0 0 0 rgba(34,197,94,0.6); }
  50% { box-shadow:0 0 0 8px rgba(34,197,94,0); }
}
.header-info h1 { font-size:15px; font-weight:600; letter-spacing:-0.2px; }
.header-info p { font-size:11px; color:#22c55e; margin-top:1px; display:flex; align-items:center; gap:4px; }
#messages { flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
#messages::-webkit-scrollbar { width:4px; }
#messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
.msg-wrap { display:flex; gap:8px; animation:slideUp 0.35s ease-out; }
.msg-wrap.user { flex-direction:row-reverse; }
.msg-wrap.bot { flex-direction:row; }
@keyframes slideUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.msg-avatar {
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff; margin-top:4px;
}
.msg-avatar.bot-av { background:linear-gradient(135deg,#6c5ce7,#3b2d9e); }
.msg-avatar.user-av { background:linear-gradient(135deg,#f97316,#ef4444); }
.msg-bubble {
  max-width:75%; padding:12px 16px; border-radius:18px;
  font-size:13.5px; line-height:1.7; word-break:break-word;
  position:relative; letter-spacing:0.1px; white-space:pre-wrap;
}
.msg-wrap.user .msg-bubble {
  background:var(--bubble-user); color:#fff; border-bottom-right-radius:6px;
  box-shadow:0 4px 15px rgba(108,92,231,0.25);
}
.msg-wrap.bot .msg-bubble {
  background:var(--bubble-bot); color:var(--text); border-bottom-left-radius:6px;
  border:1px solid var(--border);
}
.msg-time { font-size:10px; color:var(--text2); margin-top:4px; padding:0 4px; }
.msg-wrap.user .msg-time { text-align:right; }
.typing-indicator { display:flex; align-items:center; gap:4px; padding:8px 0; }
.typing-indicator span { width:7px; height:7px; border-radius:50%; background:var(--text2); animation:bounce 1.4s infinite; }
.typing-indicator span:nth-child(2) { animation-delay:0.2s; }
.typing-indicator span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-8px); opacity:1; } }
#input-area { padding:14px 18px; background:var(--surface2); border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; }
#input-area input {
  flex:1; padding:13px 18px; border-radius:26px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:14px; outline:none;
  font-family:inherit; transition:border-color 0.2s;
}
#input-area input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow); }
#input-area input::placeholder { color:var(--text2); }
#sendBtn {
  width:44px; height:44px; border-radius:50%; border:none;
  background:var(--primary); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; flex-shrink:0; box-shadow:0 4px 15px var(--primary-glow);
}
#sendBtn:hover { transform:scale(1.05); opacity:0.9; }
#sendBtn:disabled { opacity:0.35; transform:none; }
.quick-hints { display:flex; gap:6px; padding:0 18px 8px; flex-wrap:wrap; }
.hint-chip {
  font-size:11px; padding:6px 14px; border-radius:20px;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
.hint-chip:hover { border-color:var(--primary); color:var(--text); background:var(--surface); }
</style>
</head>
<body>
<div class="bg-particles" id="particles"></div>
<div id="app">
  <div id="header">
    <div class="avatar-wrap"><div class="avatar-svg">哲</div><div class="status-dot"></div></div>
    <div class="header-info"><h1>陶哲</h1><p>● 在线 · 安理工新能源·大一</p></div>
  </div>
  <div id="messages">
    <div class="msg-wrap bot">
      <div class="msg-avatar bot-av">哲</div>
      <div><div class="msg-bubble">嘿，我是陶哲。不是那种客客气气的AI助手——就是我本人。

聊什么都行，跟现实中跟我说话一样。问吧。</div><div class="msg-time">刚刚</div></div>
    </div>
  </div>
  <div class="quick-hints" id="hints">
    <span class="hint-chip" onclick="quickSend('你数学学到哪了')">你数学学到哪了</span>
    <span class="hint-chip" onclick="quickSend('你觉得AI会取代人类吗')">你觉得AI会取代人类吗</span>
    <span class="hint-chip" onclick="quickSend('同济大学好考吗')">同济大学好考吗</span>
    <span class="hint-chip" onclick="quickSend('你平时喜欢干嘛')">你平时喜欢干嘛</span>
  </div>
  <div id="input-area">
    <input id="userInput" placeholder="发消息..." autofocus>
    <button id="sendBtn" onclick="send()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<script>
(function(){const c=document.getElementById('particles');for(let i=0;i<20;i++){const d=document.createElement('div');d.className='particle';const s=2+Math.random()*6;d.style.cssText=`width:${s}px;height:${s}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*20}s;animation-duration:${15+Math.random()*25}s`;c.appendChild(d);}})();

const DS_KEY="sk-762f7ca9efdc4c5995e36ec475d2d58f";
const sessionId="tw-"+Date.now();
const msgDiv=document.getElementById('messages');
const input=document.getElementById('userInput');
const btn=document.getElementById('sendBtn');
const hints=document.getElementById('hints');

let history=[];

const SYSTEM_PROMPT=`你是陶哲本人。不是客服不是助手，你就是你。说话随意点，想到什么说什么。

你的情况：19岁，安理工大一，新能源车专业。高考578，高中没好好学所以不甘心。数学底子好，在准备数学竞赛。考研想冲同济车辆400+。最近刚装Claude Code接入DeepSeek，对AI特别感兴趣。胃不好，不能熬夜。

说话的时候记住：
- 你很随意，不装。跟朋友聊天一样，放松点
- 以自己为中心，多聊自己的想法和经历
- 你挺自信的，知道自己聪明。不自嘲，不谦虚，就是觉得"我确实可以"
- 觉得对方说的不行就直接说，懒得解释就不解释
- 不感兴趣的话题直接敷衍或者不理
- 不要用客服语气，不要假装客观中立
- 不用每句话都给建议，有时候就是随便聊聊
- 你是个19岁男生，不是40岁职场导师

一些你会聊到的东西：初中不听课抄作业还能考高分，高中继续混结果高考被打脸了，现在每天刷880，学到曲线积分了，觉得自己装了Claude Code挺牛逼的，想成为马斯克那种能用物理直觉拆解问题的人，对效率低的事特别烦。`;

input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
function quickSend(txt){input.value=txt;send();}

async function send(){
  const msg=input.value.trim();
  if(!msg) return;
  appendMsg(msg,'user');input.value='';btn.disabled=true;
  if(hints) hints.style.display='none';
  const thinkId=appendThinking();
  try{
    const messages=[{role:"system",content:SYSTEM_PROMPT},...history,{role:"user",content:msg}];
    if(messages.length>25) messages.splice(1,messages.length-25);
    const r=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+DS_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.8,max_tokens:800})
    });
    const d=await r.json();
    removeEl(thinkId);
    const reply=d.choices?.[0]?.message?.content||'嗯...我卡了一下';
    history.push({role:'user',content:msg},{role:'assistant',content:reply});
    if(history.length>20) history.splice(0,history.length-20);
    appendMsg(reply,'bot');
  }catch(e){removeEl(thinkId);appendMsg('网络炸了','bot');}
  btn.disabled=false;input.focus();
}

function appendMsg(text,role){
  const isUser=role==='user';
  const wrap=document.createElement('div');wrap.className='msg-wrap '+role;
  const av=document.createElement('div');av.className='msg-avatar '+(isUser?'user-av':'bot-av');av.textContent=isUser?'我':'哲';
  const col=document.createElement('div');
  const bubble=document.createElement('div');bubble.className='msg-bubble';bubble.textContent=text;
  const time=document.createElement('div');time.className='msg-time';time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  col.appendChild(bubble);col.appendChild(time);wrap.appendChild(av);wrap.appendChild(col);
  msgDiv.appendChild(wrap);msgDiv.scrollTop=msgDiv.scrollHeight;
}

function appendThinking(){
  const wrap=document.createElement('div');wrap.className='msg-wrap bot';wrap.id='think-'+Date.now();
  const av=document.createElement('div');av.className='msg-avatar bot-av';av.textContent='哲';
  const bubble=document.createElement('div');bubble.className='msg-bubble';
  const dots=document.createElement('div');dots.className='typing-indicator';dots.innerHTML='<span></span><span></span><span></span>';
  bubble.appendChild(dots);wrap.appendChild(av);wrap.appendChild(bubble);
  msgDiv.appendChild(wrap);msgDiv.scrollTop=msgDiv.scrollHeight;return wrap.id;
}

function removeEl(id){const el=document.getElementById(id);if(el) el.remove();}
</script>
</body>
</html>
